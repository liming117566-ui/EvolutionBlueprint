<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>几何之间 · 原书阅读</title><style>body{margin:0;background:#f8f9fa;color:#242823;font:16px/1.6 system-ui}header{position:sticky;top:0;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background:#fff;padding:12px;border-bottom:1px solid #e9ece7}button,input{font:inherit;border:1px solid #e9ece7;background:#fff;border-radius:12px;padding:8px}button{cursor:pointer}input{width:65px}main{max-width:1100px;margin:20px auto}img{display:block;max-width:100%;height:auto;margin:auto}p{text-align:center;color:#6e736f;padding:12px}a{color:inherit}button:disabled{opacity:.4}</style></head><body><header><a href="./#library">返回几何之间</a><button id="prev">上一页</button><label>原书页码 <input id="page" type="number" min="1" max="296"></label><span>/ 296</span><button id="next">下一页</button></header><main><img id="scan" alt="原书页面"><p id="status"></p></main><script>const field=document.getElementById('page'),image=document.getElementById('scan'),previous=document.getElementById('prev'),next=document.getElementById('next');let current=Number(new URLSearchParams(location.search).get('page'))||1;function show(value){current=Math.max(1,Math.min(296,Math.trunc(Number(value)||1)));field.value=current;previous.disabled=current===1;next.disabled=current===296;image.alt='原书第 '+current+' 页';image.src='./pages/'+String(current).padStart(3,'0')+'.jpg';document.getElementById('status').textContent='';history.replaceState(null,'','?page='+current)}field.onchange=()=>show(field.value);previous.onclick=()=>show(current-1);next.onclick=()=>show(current+1);image.onerror=()=>document.getElementById('status').textContent='页面加载失败，请检查网络后重试。';show(current);</script></body></html>
