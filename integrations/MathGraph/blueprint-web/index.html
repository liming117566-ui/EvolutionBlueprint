<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>初中数学图谱</title><link rel="stylesheet" href="style.css"><script defer src="vis-network.min.js"></script><script defer src="app.js"></script><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect rx=%2710%27 width=%2740%27 height=%2740%27 fill=%27%23143f32%27/%3E%3Cpath d=%27M11 11h8c3 0 5 2 5 4v14c-2-2-3-2-5-2h-8z%27 fill=%27white%27/%3E%3C/svg%3E"></head><body><header><p>新博途 · 数学学习</p><h1>初中数学图谱</h1><p>浏览知识关系，沿前置知识安排自己的学习路径。</p></header><main><section class="tools"><label>教材 <select id="book"></select></label><label>领域 <select id="domain"><option value="">全部领域</option></select></label><input id="search" placeholder="搜索知识点"><span id="stats"></span></section><section class="tools" aria-label="图谱缩放操作"><button id="zoom-in">＋ 放大</button><button id="zoom-out">－ 缩小</button><button id="fit">重置全图</button></section><p class="muted">拖动移动图谱，双指或滚轮缩放；点击节点查看下方详情。手机默认显示可读局部，点“重置全图”浏览全部关系。</p><div id="graph" aria-label="数学知识关系图"></div><div class="layout"><aside id="list"></aside><article id="detail"><h2>选择知识点</h2><p>点击图谱中的节点或下方列表，查看知识说明、掌握目标和先修关系。</p></article></div><p id="status" role="status"></p></main></body></html>
