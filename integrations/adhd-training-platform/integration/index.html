<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>ADHD儿童注意力训练平台</title><link rel="stylesheet" href="style.css"></head><body><main><header><span class="eyebrow">新博途 · 专注训练</span><h1>ADHD儿童注意力训练平台</h1><p>数字顺序游戏：在 5 × 5 方格中依次找到 1–25，练习视觉注意力与空间记忆。</p></header><section class="card"><div class="levels" aria-label="选择难度"><button data-level="easy" aria-pressed="true">简单</button><button data-level="medium" aria-pressed="false">中等</button><button data-level="hard" aria-pressed="false">困难</button></div><p id="description">找到的数字会被标记，查找范围逐渐减少。</p><div class="status"><strong id="target">准备开始</strong><span id="clock">0.00 秒</span></div><div id="grid" class="grid" aria-label="数字训练方格"></div><p id="message" role="status" aria-live="polite">选择难度后，点击开始训练。</p><div class="actions"><button id="start" class="primary">开始训练</button><button id="reset">重置</button></div></section><section class="card"><h2>本机训练记录</h2><p>按难度分别记录最近成绩与最佳用时，保存在当前设备。</p><div id="records"></div></section><footer>本活动用于日常注意力练习，不提供诊断或治疗。</footer></main><script src="app.js"></script></body></html>
